<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden}
body{font-family:'Bricolage Grotesque',sans-serif;background:#F6E7C8;position:relative;color:#0F3B2A}
.sky{position:absolute;inset:0;background:linear-gradient(#f3c46d 0%,#E8A33D 45%,#d77f2c 100%)}
.sun{position:absolute;left:880px;top:300px;width:260px;height:260px;border-radius:50%;background:#fbe3a6}
.layer{position:absolute;left:-40px;right:-40px;border-radius:48% 52% 0 0/100% 100% 0 0;box-shadow:0 -10px 24px rgba(0,0,0,.18)}
.l1{bottom:180px;height:300px;background:#c46a33}
.l2{bottom:110px;height:280px;background:#7A4A24}
.l3{bottom:40px;height:260px;background:#2a5a3a}
.l4{bottom:-60px;height:240px;background:#0F3B2A}
.palm{position:absolute;width:20px;background:#3b2414;border-radius:10px;transform-origin:bottom}
.fr{position:absolute;width:180px;height:38px;background:#0F3B2A;border-radius:0 100% 0 100%}
.nav{position:absolute;left:56px;right:56px;top:36px;display:flex;align-items:center;gap:40px;font-size:17px;font-weight:600}
.nav .logo{font-weight:800;font-size:24px;letter-spacing:.04em;margin-right:auto}
.nav .q{background:#0F3B2A;color:#F6E7C8;padding:14px 26px;border-radius:999px}
h1{position:absolute;left:56px;top:150px;font-size:118px;line-height:.92;font-weight:800;letter-spacing:-.03em;max-width:820px}
.sub{position:absolute;left:60px;top:400px;font-size:22px;line-height:1.45;max-width:520px;font-weight:500}
.go{position:absolute;left:60px;top:490px;background:#F6E7C8;color:#0F3B2A;padding:18px 30px;border-radius:999px;font-weight:700;font-size:18px}
.hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);color:#F6E7C8;font-size:14px;letter-spacing:.2em;text-transform:uppercase}
</style></head><body>
<div class="sky"></div><div class="sun"></div>
<div class="layer l1"></div>
<div class="palm" style="left:1100px;top:330px;height:420px;transform:rotate(8deg)"></div>
<div class="fr" style="left:990px;top:300px;transform:rotate(-30deg)"></div>
<div class="fr" style="left:1120px;top:290px;transform:rotate(25deg) scaleX(-1)"></div>
<div class="fr" style="left:1040px;top:262px;transform:rotate(-70deg)"></div>
<div class="layer l2"></div>
<div class="layer l3"></div>
<div class="palm" style="left:1260px;top:200px;height:700px;transform:rotate(-6deg);background:#0b2a1e"></div>
<div class="fr" style="left:1130px;top:170px;width:260px;height:52px;transform:rotate(-20deg)"></div>
<div class="fr" style="left:1290px;top:150px;width:260px;height:52px;transform:rotate(20deg) scaleX(-1)"></div>
<div class="layer l4"></div>
<div class="nav"><span class="logo">SAKSAVI</span><span>Products</span><span>Journey</span><span>Export</span><span class="q">Request a quote</span></div>
<h1>From our grove to your port.</h1>
<p class="sub">Semi-husked, dehusked and tender coconuts, plus copra, oil and desiccated coconut, shipped worldwide.</p>
<span class="go">Follow the journey ↓</span>
<span class="hint">Scroll</span>
</body></html>
