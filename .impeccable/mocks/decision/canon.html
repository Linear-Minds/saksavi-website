<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden}
body{font-family:Manrope,sans-serif;background:#FFFFFF;color:#1d2a22}
.nav{display:flex;align-items:center;gap:36px;padding:26px 80px;font-weight:600;font-size:16px;border-bottom:1px solid #e6e9e4}
.nav .logo{color:#1B4D2B;font-weight:800;font-size:22px;margin-right:auto}
.nav .b{background:#1B4D2B;color:#fff;padding:12px 22px;border-radius:8px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:70px 80px 0;align-items:center}
.eyebrow{color:#8A5A2B;font-weight:800;letter-spacing:.12em;font-size:13px;text-transform:uppercase}
h1{font-size:66px;line-height:1.05;font-weight:800;color:#1B4D2B;margin-top:16px}
p{font-size:19px;line-height:1.6;color:#4a554e;margin-top:20px;max-width:520px}
.btns{display:flex;gap:14px;margin-top:32px}
.btns span{padding:16px 26px;border-radius:8px;font-weight:700}
.p{background:#1B4D2B;color:#fff}.s{border:1.5px solid #1B4D2B;color:#1B4D2B}
.img{height:470px;border-radius:20px;background:#F3F4F1;position:relative;overflow:hidden}
.c{position:absolute;border-radius:50%;background:#8A5A2B;box-shadow:inset -14px -18px 0 #6d4420}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:46px 80px}
.card{background:#F3F4F1;border-radius:14px;height:120px;padding:20px;font-weight:700;color:#1B4D2B}
</style></head><body>
<div class="nav"><span class="logo">SAKSAVI Agro Exports</span><span>Home</span><span>Products</span><span>About</span><span>Contact</span><span class="b">Get a quote</span></div>
<div class="hero">
  <div><div class="eyebrow">Coconut exporter</div><h1>Pure coconuts. Global reach.</h1><p>Semi-husked, dehusked and tender coconuts, plus copra, oil and desiccated coconut for importers worldwide.</p>
  <div class="btns"><span class="p">Request a quote</span><span class="s">View products</span></div></div>
  <div class="img"><div class="c" style="left:120px;top:150px;width:200px;height:210px"></div><div class="c" style="left:290px;top:190px;width:180px;height:190px"></div><div class="c" style="left:210px;top:290px;width:170px;height:170px"></div></div>
</div>
<div class="cards"><div class="card">Semi-husked</div><div class="card">Dehusked</div><div class="card">Tender</div><div class="card">Copra &amp; oil</div></div>
</body></html>
